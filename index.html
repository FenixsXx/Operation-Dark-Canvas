<script>
const STATE_ENDPOINT='/api/state',ACTIVITY_ENDPOINT='/api/activity',icons=document.getElementById('icons'),startItems=document.getElementById('startItems'),clock=document.getElementById('clock');

function esc(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
function setConnectionStatus(online){const indicator=document.getElementById('connectionStatus');if(indicator){indicator.textContent=online?'● ONLINE':'● OFFLINE';indicator.className=`font-mono text-xs ${online?'text-emerald-300':'text-rose-300'}`}}
function renderTasks(){const tasks=document.getElementById('tasks');if(!tasks)return;tasks.innerHTML=[...windows.entries()].map(([app,element])=>`<button class="task" data-task="${esc(app)}">${esc(apps[app]?.[0]||app)}</button>`).join('');tasks.querySelectorAll('[data-task]').forEach(button=>button.onclick=()=>windows.get(button.dataset.task)?.classList.toggle('hidden'))}
function focusWindow(element){element.style.zIndex=++z}
function wire(element,app){element.querySelector('.bg-rose-500')?.addEventListener('click',()=>{element.remove();windows.delete(app);renderTasks()});element.querySelector('.bg-amber-400')?.addEventListener('click',()=>element.classList.add('hidden'));element.addEventListener('pointerdown',()=>focusWindow(element));const titlebar=element.querySelector('.titlebar');titlebar?.addEventListener('pointerdown',event=>{if(event.target.closest('button')||matchMedia('(max-width:640px)').matches)return;const bounds=element.getBoundingClientRect(),offsetX=event.clientX-bounds.left,offsetY=event.clientY-bounds.top;const move=pointerEvent=>{element.style.left=`${Math.max(8,pointerEvent.clientX-offsetX)}px`;element.style.top=`${Math.max(8,pointerEvent.clientY-offsetY)}px`};const stop=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',stop)};addEventListener('pointermove',move);addEventListener('pointerup',stop)})}
